<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Jelenléti dokumentáció</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <link rel="icon" type="image/x-icon" href="/media/favicon.svg">
  
  <style>

    .github-corner {
      display:none;
    }
    .token {
       display: inline-block;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
        color: white;
        line-height: 1;
    }
    
    .badge {
       display: inline-block;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        line-height: 1;
        border: 1px solid;
    }

    .badge-gray {
      color: #4C5057;
      background-color: #F0F3F4;
      border-color: #E1E6EA;
    }
    .badge-blue {
      color: #408BF6;
      background-color: #F6FCFE;
      border-color: #408BF6;
    }
    .badge-red {
      color: #BD2612;
      background-color: #FFF4F3;
      border-color: #BD2612;
    }
    .badge-yellow {
      color: #F3930C;
      background-color: #FFFBEC;
      border-color: #F3930C;
    }
    .badge-green {
      color: #007547;
      background-color: #F6FDF8;
      border-color: #007547;
    }

    .text-highlight {
      background-color: #FFF4CA;
      padding: 3px 5px;
    }

    .text-lowlight {
      font-style: italic;
      color: #BBBBBB;
    }

    .markdown-section p {
      white-space: pre-line;
      padding: 0;
      margin: 0;
    }    
  </style>
</head>
<body>
  <div id="app">Betöltés...</div>
  <script>
    window.$docsify = {
      logo: '/media/logo.png',
      name: 'Jelenléti',
      repo: 'https://github.com/neowellsupport/jelenleti',
      loadSidebar: true,   // Sidebar engedélyezése      
      maxLevel: 4,
      subMaxLevel: 2,
      auto2top: true,      // Oldalváltáskor az elejére ugrik
      search: {
        maxAge: 1000,
        placeholder: 'Keresés...',
        noData: 'Nincs találat!',
        depth: 6,
        paths: 'auto'
      },
      plugins: [
      function(hook, vm) {
        hook.beforeEach(function(html) {
          // A te felhasználóneved és repo neved alapján:
          var url = 'https://github.com/neowellsupport/jelenleti/blob/main/docs/' + vm.route.file;
          var editHtml = '[📝](' + url + ')\n\n';

          html = html.replace(/\[token:(.*?):(.*?)\]/g, function(match, color, text) {
            if(color == 'blue') color = '#337AB7';
            if(color == 'red') color = '#D3455B';
            if(color == 'yellow') color = '#F7C325';
            if(color == 'green') color = '#1AAE9F';
            if(color == 'gray') color = '#707070';
            return '<span class="token" style="background-color: ' + color + ';">' + text + '</span>';
          });
          html = html.replace(/\[badge:(.*?):(.*?)\]/g, function(match, color, text) {
            return '<span class="badge badge-' + color + '">' + text + '</span>';
          });
          html = html.replace(/\[high:(.*?)\]/g, function(match, text) {
            return '<span class="text-highlight">' + text + '</span>';
          });
          html = html.replace(/\[low:(.*?)\]/g, function(match, text) {
            return '<span class="text-lowlight">' + text + '</span>';
          });
          
          return editHtml + html;
        });
      }
    ],
      'flexible-alerts': {
        style: 'callout' // Vagy 'callout' a modernebb kinézethez
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
</body>
</html>
